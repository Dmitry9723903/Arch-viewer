<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Architecture</title>
<style>
  :root {
    --bg: #0f1117; --panel: #161922; --line: #2a2f3d; --ink: #e6e9ef;
    --dim: #8b93a7; --accent: #5b9dff; --bad: #ff5c5c; --ok: #3ddc97;
    --box: #1d2230; --box-hover: #262d3d;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f6f7f9; --panel: #ffffff; --line: #d9dde5; --ink: #1a1d24;
      --dim: #5d6474; --accent: #1f6feb; --bad: #d1242f; --ok: #1a7f5a;
      --box: #ffffff; --box-hover: #eef1f6;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
           padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  h1 { font-size: 15px; margin: 0; font-weight: 600; }
  nav { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; color: var(--dim); }
  nav button { background: none; border: none; color: var(--accent); cursor: pointer;
               font: inherit; padding: 2px 4px; border-radius: 4px; }
  nav button:hover { background: var(--box-hover); }
  .counts { margin-left: auto; color: var(--dim); font-size: 12px; }
  .counts b { color: var(--ink); font-weight: 600; }
  .counts .bad { color: var(--bad); }
  main { display: grid; grid-template-columns: 1fr 4px var(--aside, 520px);
         height: calc(100vh - 49px); }
  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; height: auto; }
    .grip { display: none; }
  }
  #canvas { overflow: auto; padding: 16px; }
  aside { border-left: 1px solid var(--line); background: var(--panel);
          overflow: auto; padding: 16px; min-width: 300px; }
  .grip { cursor: col-resize; background: var(--line); width: 3px; }
  .grip:hover { background: var(--accent); }
  @media (max-width: 860px) { aside { border-left: none; border-top: 1px solid var(--line); } }
  aside h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
             color: var(--dim); margin: 14px 0 8px; font-weight: 600; }
  .out-dot, .into-dot { display: inline-block; width: 8px; height: 8px;
                        border-radius: 2px; margin-right: 6px; }
  .out-dot { background: var(--accent); }
  .into-dot { background: var(--ok); }
  aside h3 { font-size: 15px; margin: 0 0 4px; }
  .kind { color: var(--dim); font-size: 12px; margin-bottom: 12px; }
  .type { padding: 6px 0; border-top: 1px solid var(--line); }
  .type .name { font-weight: 600; }
  .type .tri { color: var(--dim); font-size: 10px; width: 10px; }
  .type .st { color: var(--dim); font-size: 12px; }
  .type .vis { color: var(--dim); font-size: 11px; border: 1px solid var(--line);
               border-radius: 3px; padding: 0 4px; }
  .member { color: var(--dim); font-size: 12px;
            font-family: ui-monospace, Menlo, Consolas, monospace; padding-left: 10px; }
  a.src { color: var(--accent); font-size: 12px; text-decoration: none;
          display: inline-block; margin: 4px 0; }
  a.src:hover { text-decoration: underline; }
  .viol { color: var(--bad); font-size: 12px; padding: 4px 0; border-top: 1px solid var(--line);
          font-family: ui-monospace, Menlo, Consolas, monospace; }
  .type.open { background: var(--box-hover); margin: 0 -8px; padding: 6px 8px; border-radius: 6px; }
  .type .head { cursor: pointer; display: flex; align-items: baseline; gap: 6px; }
  .type .head:hover .name { color: var(--accent); }
  .code { margin: 8px 0 4px; border: 1px solid var(--line); border-radius: 6px;
          background: var(--bg); overflow: auto; max-height: 60vh; }
  .code table { border-collapse: collapse; font-family: ui-monospace, Menlo, Consolas, monospace;
                font-size: 12px; line-height: 1.45; width: 100%; }
  .code td.n { text-align: right; padding: 0 8px 0 10px; color: var(--dim);
               user-select: none; width: 1%; white-space: nowrap;
               border-right: 1px solid var(--line); }
  .code td.l { padding: 0 10px; white-space: pre; color: var(--ink); }
  .code .kw { color: var(--accent); }
  .code .cm { color: var(--dim); font-style: italic; }
  .code .st { color: var(--ok); }
  .nocode { color: var(--dim); font-size: 12px; padding: 6px 0; }
  .own-types { color: var(--dim); font-size: 12px; margin: 18px 0 6px 20px;
               text-transform: uppercase; letter-spacing: .06em; }
  .empty { color: var(--dim); }
  g.node rect { fill: var(--box); stroke: var(--line); stroke-width: 1; rx: 8; cursor: pointer; }
  g.node:hover rect { fill: var(--box-hover); stroke: var(--accent); }
  g.node.sel rect { stroke: var(--accent); stroke-width: 2; }
  g.node text { fill: var(--ink); font-size: 13px; font-weight: 600; pointer-events: none; }
  g.node text.sub { fill: var(--dim); font-size: 11px; font-weight: 400; }
  g.type-node rect { stroke-dasharray: 3 2; }
  g.type-node.sel rect { stroke-dasharray: none; }
  path.edge { fill: none; stroke: var(--line); stroke-width: 1.5; marker-end: url(#a); }
  path.edge.out { stroke: var(--accent); stroke-width: 2; marker-end: url(#ah); }
  path.edge.into { stroke: var(--ok); stroke-width: 2; marker-end: url(#ai); }
  /* A violation outranks the highlight: whichever box is selected, a broken
     rule is the thing to see. */
  path.edge.bad { stroke: var(--bad); stroke-width: 2.5; marker-end: url(#ab); }
  path.edge.faint { opacity: .18; }
  /* Evidence of another kind, drawn as such: read from another tool's graph
     rather than from this repository's own metadata. */
  path.edge.borrowed { stroke-dasharray: 5 3; }
  /* Not a box on this level — a direction out of it. Smaller, dimmer and
     dashed, so it is never mistaken for one of the things drawn here. */
  g.anchor rect { fill: none; stroke: var(--line); stroke-dasharray: 3 2; rx: 4; cursor: pointer; }
  g.anchor text { font-size: 11px; fill: var(--dim);
                  font-family: ui-monospace, Menlo, Consolas, monospace; pointer-events: none; }
  g.anchor:hover rect { stroke: var(--accent); }
  g.anchor:hover text { fill: var(--accent); }
  g.anchor.incoming rect { stroke: var(--ok); opacity: .55; }
  g.anchor.outgoing rect { stroke: var(--accent); opacity: .55; }
  path.edge.bad.faint { opacity: .5; }
  text.rule { fill: var(--bad); font-size: 10px;
              font-family: ui-monospace, Menlo, Consolas, monospace; }
</style>
</head>
<body>
<header>
  <h1 id="title">Architecture</h1>
  <nav id="crumbs"></nav>
  <div class="counts" id="counts"></div>
</header>
<main id="main">
  <div id="canvas"></div>
  <div class="grip" id="grip"></div>
  <aside id="panel"></aside>
</main>
<script>
const MODEL = /*MODEL*/null;

const state = { path: [], selected: null, openType: null };

function childrenAt(path) {
  let list = MODEL.nodes;
  for (const id of path) {
    const node = list.find(n => n.id === id);
    if (!node) return [];
    list = node.children || [];
  }
  return list;
}

function nodeAt(path) {
  let list = MODEL.nodes, node = null;
  for (const id of path) {
    node = list.find(n => n.id === id);
    if (!node) return null;
    list = node.children || [];
  }
  return node;
}

// Every id at or underneath a node, used to roll edges up to visible boxes.
// The node itself counts: an edge names a project, and a project may now hold
// namespace containers, which would otherwise make it invisible to its own
// edges. Collecting only childless nodes was an unwritten assumption that the
// ends of an edge are always leaves, and it stopped being true.
function idsUnder(node, acc = []) {
  acc.push(node.id);
  for (const c of node.children || []) idsUnder(c, acc);
  // Types are edge ends too, once the model carries references between them.
  for (const t of node.types || []) acc.push(t.id);
  return acc;
}

function countTypes(node) {
  let n = (node.types || []).length;
  for (const c of node.children || []) n += countTypes(c);
  return n;
}

// Edges between the boxes currently on screen, with violations preserved.
function visibleEdges(boxes) {
  const owner = new Map();
  for (const b of boxes) {
    if (b.node) idsUnder(b.node).forEach(id => owner.set(id, b.id));
    else owner.set(b.id, b.id);
  }
  const seen = new Map();
  for (const e of MODEL.edges) {
    const a = owner.get(e.from), b = owner.get(e.to);
    if (!a || !b || a === b) continue;
    const key = a + '\u0000' + b;
    const prev = seen.get(key);
    if (prev && !prev.violates) { if (e.violates) prev.violates = e.violates; continue; }
    if (!prev) seen.set(key, {
      from: a, to: b, violates: e.violates || null,
      kind: e.kind, origin: e.origin || null,
    });
  }
  return [...seen.values()];
}

function render() {
  writeAddress();
  const nodes = childrenAt(state.path);
  const current = nodeAt(state.path);
  document.getElementById('title').textContent = MODEL.title;
  renderCrumbs();
  renderCounts(nodes, current);

  const canvas = document.getElementById('canvas');
  canvas.innerHTML = '';

  // Containers and the types declared here are drawn together, in one
  // system of boxes with one set of arrows. Drawn in two passes they had no
  // lines between them, and a type referring to a neighbouring namespace —
  // which is most of what a domain does — looked unconnected.
  const own = (current && current.types) || [];
  const boxes = [
    ...nodes.map(n => ({ id: n.id, node: n, type: null })),
    ...own.map(t => ({ id: t.id, node: null, type: t })),
  ];

  if (boxes.length === 0) {
    canvas.innerHTML = '<p class="empty">Nothing here.</p>';
    if (current) select(current);
    return;
  }

  const edges = visibleEdges(boxes);

  // Where nothing here refers to anything else here, the canvas is a grid of
  // boxes with no lines, which reads as a broken drawing rather than as a
  // fact about the code. Say it, and say where the connections went.
  const outward = leaving(boxes);
  const cols = Math.max(1, Math.min(5, Math.ceil(Math.sqrt(boxes.length))));
  const W = 200, H = 64, GX = 90, GY = 60;
  const pos = new Map();
  const shift = (outward.out.size || outward.into.size) ? 190 : 0;
  boxes.forEach((b, i) => {
    const row = Math.floor(i / cols), col = i % cols;
    pos.set(b.id, { x: col * (W + GX) + 20 + shift, y: row * (H + GY) + 20 });
  });
  const rows = Math.ceil(boxes.length / cols);
  const margin = (outward.out.size || outward.into.size) ? 190 : 0;
  const width = cols * (W + GX) + 40 + margin * 2;
  const height = Math.max(rows * (H + GY) + 40, 24 + 6 * 30 + 20);

  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('width', width);
  svg.setAttribute('height', height);
  svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
  svg.innerHTML = markers();

  for (const e of edges) svg.appendChild(edgePath(pos, e, W, H));
  for (const b of boxes) {
    svg.appendChild(b.node
      ? nodeBox(b.node, pos.get(b.id), W, H)
      : typeBox(b.type, current, pos.get(b.id), W, H));
  }

  anchors(svg, outward, width, height);
  canvas.appendChild(svg);

  if (edges.length === 0 && boxes.length > 1) {
    const note = document.createElement('p');
    note.className = 'own-types';
    note.textContent = outward.out.size || outward.into.size
      ? `Nothing here refers to anything else here — the arrows at the edges lead to what does.`
      : 'Nothing here refers to anything else here, and nothing refers to it.';
    canvas.appendChild(note);
  }

  if (!state.selected && current) select(current);
}

// References crossing this level's edge, counted so the reader knows whether
// an empty canvas means "unconnected" or "connected elsewhere", and gathered
// so the other end can be drawn.
function leaving(boxes) {
  const inside = new Set();
  for (const b of boxes) {
    if (b.node) idsUnder(b.node).forEach(id => inside.add(id));
    else inside.add(b.id);
  }
  const out = new Map(), into = new Map();
  for (const e of MODEL.edges) {
    const from = inside.has(e.from), to = inside.has(e.to);
    if (from && !to) keep(out, e.to, e);
    else if (to && !from) keep(into, e.from, e);
  }
  return { out, into };
}

function keep(map, id, e) {
  if (!map.has(id)) map.set(id, { id, edges: [] });
  map.get(id).edges.push(e);
}

// Where a node lives, so clicking an anchor can go there.
function pathTo(id, list = MODEL.nodes, trail = []) {
  for (const n of list) {
    if (n.id === id) return { path: trail, box: n.id, type: null };
    for (const t of n.types || []) {
      if (t.id === id) return { path: trail, box: n.id, type: t.id };
    }
    const deeper = pathTo(id, n.children || [], [...trail, n.id]);
    if (deeper) return deeper;
  }
  return null;
}

// The other end of a reference that leaves this level. Drawn small and faint
// and never in the grid: it is not one of the things here, it is a direction.
function anchors(svg, outward, width, height) {
  const shown = (map, side, css) => [...map.values()]
    .sort((a, b) => b.edges.length - a.edges.length)
    .slice(0, 6)
    .map((item, i) => {
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.setAttribute('class', 'anchor ' + css);
      const y = 24 + i * 30;
      const x = side === 'out' ? width - 176 : 8;

      const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      r.setAttribute('x', x); r.setAttribute('y', y);
      r.setAttribute('width', 168); r.setAttribute('height', 22);

      const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      label.setAttribute('x', x + 8); label.setAttribute('y', y + 15);
      label.textContent = (side === 'out' ? '→ ' : '← ') + trim(short(item.id), 18)
        + (item.edges.length > 1 ? ` ×${item.edges.length}` : '');

      const tip = document.createElementNS('http://www.w3.org/2000/svg', 'title');
      tip.textContent = item.id + (side === 'out' ? ' — referenced from here' : ' — refers to something here');
      g.append(r, label, tip);

      g.addEventListener('click', ev => {
        ev.stopPropagation();
        const where = pathTo(item.id);
        if (!where) return;
        state.path = where.path;
        state.selected = where.box;
        state.openType = where.type;
        render();
        restore();
      });
      return g;
    });

  for (const g of shown(outward.into, 'in', 'incoming')) svg.appendChild(g);
  for (const g of shown(outward.out, 'out', 'outgoing')) svg.appendChild(g);
}

// One box for one type, dashed to tell it from a container.
function typeBox(t, owner, at, W, H) {
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.setAttribute('class', 'node type-node' + (state.openType === t.id ? ' sel' : ''));

  const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  r.setAttribute('x', at.x); r.setAttribute('y', at.y);
  r.setAttribute('width', W); r.setAttribute('height', H);

  const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  label.setAttribute('x', at.x + 14); label.setAttribute('y', at.y + 26);
  label.textContent = trim(t.name, 24);

  const sub = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  sub.setAttribute('class', 'sub');
  sub.setAttribute('x', at.x + 14); sub.setAttribute('y', at.y + 46);
  sub.textContent = [
    t.visibility && t.visibility !== 'public' ? t.visibility : null,
    t.stereotype,
    (t.members || []).length ? (t.members.length + ' members') : null,
  ].filter(Boolean).join(' · ');

  g.append(r, label, sub);
  g.addEventListener('click', ev => {
    ev.stopPropagation();
    state.openType = state.openType === t.id ? null : t.id;
    state.selected = t.id;
    render();
    select(owner);
  });
  return g;
}

function markers() {
  const one = (id, colour) =>
    `<marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
      orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${colour}"/></marker>`;
  return `<defs>${one('a', 'var(--line)')}${one('ab', 'var(--bad)')}` +
         `${one('ah', 'var(--accent)')}${one('ai', 'var(--ok)')}</defs>`;
}

function edgePath(pos, e, W, H, anchor = state.selected) {
  const a = pos.get(e.from), b = pos.get(e.to);
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  const x1 = a.x + W / 2, y1 = a.y + H / 2, x2 = b.x + W / 2, y2 = b.y + H / 2;
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2 - Math.abs(x2 - x1) * 0.12 - 18;
  p.setAttribute('d', `M${x1},${y1} Q${mx},${my} ${x2},${y2}`);

  // With a box selected the rest of the mesh is noise: what it reaches and
  // what reaches it are the two questions a dependency graph is asked.
  const out = anchor === e.from;
  const into = anchor === e.to;
  const dim = anchor && !out && !into;

  p.setAttribute('class', 'edge'
    + (e.origin ? ' borrowed' : '')
    + (e.violates ? ' bad' : '')
    + (out ? ' out' : '')
    + (into ? ' into' : '')
    + (dim ? ' faint' : ''));

  const t = document.createElementNS('http://www.w3.org/2000/svg', 'title');
  const origin = e.origin ? ` (${e.origin})` : '';
  t.textContent = e.violates
    ? `${short(e.from)} → ${short(e.to)} [${e.kind}]${origin} breaks ${e.violates}`
    : `${short(e.from)} → ${short(e.to)} [${e.kind}]${origin}`;
  p.appendChild(t);
  return p;
}

function nodeBox(n, at, W, H) {
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.setAttribute('class', 'node' + (state.selected === n.id ? ' sel' : ''));
  const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  r.setAttribute('x', at.x); r.setAttribute('y', at.y);
  r.setAttribute('width', W); r.setAttribute('height', H);
  const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  label.setAttribute('x', at.x + 14); label.setAttribute('y', at.y + 26);
  label.textContent = trim(n.label, 24);
  const kids = (n.children || []).length, types = countTypes(n);
  const sub = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  sub.setAttribute('class', 'sub');
  sub.setAttribute('x', at.x + 14); sub.setAttribute('y', at.y + 46);
  sub.textContent = [n.role, kids ? kids + ' inside' : null, types ? types + ' types' : null]
    .filter(Boolean).join(' · ') || n.kind;
  g.append(r, label, sub);
  g.addEventListener('click', ev => {
    ev.stopPropagation();
    if (state.selected === n.id && kids) { state.path = [...state.path, n.id]; state.selected = null; state.openType = null; }
    else { state.selected = n.id; state.openType = null; select(n); }
    render();
  });
  g.addEventListener('dblclick', ev => {
    ev.stopPropagation();
    if (kids) { state.path = [...state.path, n.id]; state.selected = null; render(); }
  });
  const tip = document.createElementNS('http://www.w3.org/2000/svg', 'title');
  tip.textContent = kids ? 'Click to select, again to open' : 'Click to inspect';
  g.appendChild(tip);
  return g;
}

function trim(s, n) { return s.length > n ? s.slice(0, n - 1) + '…' : s; }

function renderCrumbs() {
  const nav = document.getElementById('crumbs');
  nav.innerHTML = '';
  const add = (label, path) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.onclick = () => { state.path = path; state.selected = null; render(); };
    nav.appendChild(b);
  };
  add('top', []);
  state.path.forEach((id, i) => {
    nav.appendChild(document.createTextNode('/'));
    const node = nodeAt(state.path.slice(0, i + 1));
    add(node ? node.label : id, state.path.slice(0, i + 1));
  });
}

function renderCounts(nodes, current) {
  const scope = current ? [current] : MODEL.nodes;
  const within = new Set(scope.flatMap(n => idsUnder(n)));
  // Crossings, not references. One adapter reaching into another module is
  // recorded twice — once between the projects, once between the types that
  // make the reference — and it is still one broken boundary.
  const bad = crossings(MODEL.edges.filter(e => e.violates && within.has(e.from)));

  // Leaves are not projects: below the project level they are namespaces, and
  // calling thirty namespaces "projects" is simply wrong.
  const projects = count(scope, n => n.kind === 'project');
  const types = scope.reduce((sum, n) => sum + countTypes(n), 0);

  document.getElementById('counts').innerHTML =
    `<b>${nodes.length}</b> here · ` +
    (projects ? `<b>${projects}</b> projects · ` : '') +
    `<b>${types}</b> types · ` +
    (bad.length ? `<span class="bad"><b>${bad.length}</b> violations</span>` : `<span>no violations</span>`);
}

// A violation is a pair of containers and the rule between them. Several
// references may realise the same crossing; they are one thing to fix.
function crossings(edges) {
  const owner = new Map();
  const index = node => {
    for (const t of node.types || []) owner.set(t.id, node.id);
    for (const c of node.children || []) index(c);
  };
  MODEL.nodes.forEach(index);

  const seen = new Set();
  for (const e of edges) {
    const a = owner.get(e.from) || e.from;
    const b = owner.get(e.to) || e.to;
    seen.add(`${a}\u0000${b}\u0000${e.violates}`);
  }
  return [...seen];
}

function count(nodes, fits) {
  let n = 0;
  for (const node of nodes) {
    if (fits(node)) n++;
    n += count(node.children || [], fits);
  }
  return n;
}

function select(n) {
  const panel = document.getElementById('panel');
  const types = n.types || [];
  const bad = MODEL.edges.filter(e => e.violates && idsUnder(n).includes(e.from));
  // Targets, not edges: several projects of a module may reference the same
  // thing, and listing it twice says nothing the first line did not.
  const inside = idsUnder(n);
  const out = [...new Map(
    MODEL.edges.filter(e => inside.includes(e.from) && !inside.includes(e.to)).map(e => [e.to, e])
  ).values()];

  let html = `<h3>${esc(n.label)}</h3><div class="kind">${esc(n.kind)}${n.role ? ' · ' + esc(n.role) : ''}</div>`;
  if (n.project) html += `<div class="kind">${esc(n.project)}</div>`;

  if (bad.length) {
    const grouped = new Map();
    for (const e of bad) {
      const key = `${e.violates}`;
      if (!grouped.has(key)) grouped.set(key, []);
      grouped.get(key).push(e);
    }
    html += `<h2>Violations</h2>`;
    for (const [rule, list] of grouped) {
      for (const e of list) {
        html += `<div class="viol">${esc(short(e.from))} → ${esc(short(e.to))} · ${esc(rule)}</div>`;
      }
    }
  }

  const into = [...new Map(
    MODEL.edges.filter(e => inside.includes(e.to) && !inside.includes(e.from)).map(e => [e.from, e])
  ).values()];

  const borrowed = out.filter(e => e.origin).length;
  html += `<h2><span class="out-dot"></span>Depends on (${out.length})`;
  if (borrowed) html += ` <span class="vis">${borrowed} from graphify</span>`;
  html += `</h2>`;
  html += out.length
    ? list(out.map(e => e.to))
    : '<p class="empty">Nothing.</p>';

  html += `<h2><span class="into-dot"></span>Depended on by (${into.length})</h2>`;
  html += into.length
    ? list(into.map(e => e.from))
    : '<p class="empty">Nothing.</p>';

  if (types.length) {
    html += `<h2>Types (${types.length})</h2>`;
    types.forEach((t, i) => {
      const open = state.openType === t.id;
      html += `<div class="type${open ? ' open' : ''}">`;
      html += `<div class="head" data-type="${i}">`;
      html += `<span class="tri">${open ? '▾' : '▸'}</span>`;
      html += `<span class="name">${esc(t.name)}</span> <span class="st">${esc(t.stereotype)}</span>`;
      if (t.visibility && t.visibility !== 'public') html += ` <span class="vis">${esc(t.visibility)}</span>`;
      html += `</div>`;
      if (open) {
        if (t.file) {
          const abs = MODEL.root + '/' + t.file;
          html += `<a class="src" href="vscode://file/${encodeURI(abs)}:${t.line || 1}">${esc(t.file)}:${t.line || 1} — open in editor</a>`;
        }
        html += t.source
          ? renderCode(t.source, t.line || 1)
          : `<p class="nocode">No source text was read for this type.</p>`;
        for (const m of (t.members || [])) html += `<div class="member">${esc(m.text)}</div>`;
      }
      html += `</div>`;
    });
  } else if (!n.children || n.children.length === 0) {
    // What an empty container means is the extractor's to say, not this
    // page's: it differs by ecosystem, and this page knows of none.
    html += `<h2>Types</h2><p class="empty">${esc(n.note || 'Nothing was read in this container.')}</p>`;
  }

  panel.innerHTML = html;

  const opened = panel.querySelector('.type.open');
  if (opened) opened.scrollIntoView({ block: 'nearest' });

  panel.querySelectorAll('.head').forEach(el => {
    el.addEventListener('click', () => {
      const t = types[Number(el.dataset.type)];
      state.openType = state.openType === t.id ? null : t.id;
      writeAddress();
      select(n);
    });
  });
}

// Source lines with numbers. Highlighting stays deliberately crude: keywords,
// comments and strings. A real tokeniser would be a dependency, and this is a
// map of the code, not an editor.
function renderCode(source, firstLine) {
  const lines = source.split('\n');
  let html = '<div class="code"><table>';
  lines.forEach((line, i) => {
    html += `<tr><td class="n">${firstLine + i}</td><td class="l">${colour(line)}</td></tr>`;
  });
  return html + '</table></div>';
}

const KEYWORDS = new RegExp('\\b(' + [
  'public','private','protected','internal','static','readonly','const','sealed','abstract',
  'virtual','override','partial','class','record','struct','interface','enum','namespace',
  'using','return','if','else','for','foreach','while','switch','case','break','continue',
  'new','this','base','null','true','false','var','void','async','await','try','catch',
  'finally','throw','get','set','init','required','in','out','ref','is','as','typeof','where'
].join('|') + ')\\b', 'g');

function colour(line) {
  const escaped = esc(line);
  const comment = escaped.indexOf('//');
  if (comment >= 0) {
    return paint(escaped.slice(0, comment)) + '<span class="cm">' + escaped.slice(comment) + '</span>';
  }
  return paint(escaped);
}

function paint(text) {
  return text
    .replace(/&quot;[^&]*?&quot;/g, m => '\u0000' + m + '\u0001')
    .replace(KEYWORDS, '<span class="kw">$1</span>')
    .replace(/\u0000(.*?)\u0001/g, '<span class="st">$1</span>');
}

// Short names collide — two modules may each hold an "Application", and a
// list of identical words tells the reader nothing. Where they collide, one
// more segment is shown, which is the least that distinguishes them.
function list(ids) {
  const seen = new Map();
  for (const id of ids) {
    const name = short(id);
    seen.set(name, (seen.get(name) || 0) + 1);
  }
  return ids
    .map(id => esc(seen.get(short(id)) > 1 ? tail(id, 2) : short(id)))
    .map(text => `<div class="member">${text}</div>`)
    .join('');
}

function tail(id, count) {
  const parts = id.split(/[./]/);
  return parts.slice(Math.max(0, parts.length - count)).join('.');
}

// Container ids are paths above the project ("Payroll/Example.Payroll.Domain")
// and dotted below it ("…Domain.Rates"). Both need shortening, or the panel
// prints the whole address.
function short(id) {
  const cut = Math.max(id.lastIndexOf('/'), id.lastIndexOf('.'));
  return cut < 0 ? id : id.slice(cut + 1);
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

// The view lives in the address, so a particular box — or a particular type
// with its source open — can be linked to and reopened.
function readAddress() {
  const raw = decodeURIComponent(location.hash.replace(/^#/, ''));
  if (!raw) return;
  const parts = new URLSearchParams(raw);
  const at = parts.get('at');
  state.path = at ? at.split('\u007c').filter(Boolean) : [];
  state.selected = parts.get('box');
  state.openType = parts.get('type');
}

function writeAddress() {
  const parts = new URLSearchParams();
  if (state.path.length) parts.set('at', state.path.join('\u007c'));
  if (state.selected) parts.set('box', state.selected);
  if (state.openType) parts.set('type', state.openType);
  const next = '#' + parts.toString();
  if (next !== location.hash) history.replaceState(null, '', next);
}

window.addEventListener('hashchange', () => { readAddress(); render(); restore(); });

// The panel holds source, so its width is the reader's business, not ours.
(function draggable() {
  const grip = document.getElementById('grip');
  const main = document.getElementById('main');
  if (!grip || !main) return;
  let dragging = false;
  grip.addEventListener('mousedown', e => { dragging = true; e.preventDefault(); });
  window.addEventListener('mouseup', () => { dragging = false; });
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    const width = Math.min(Math.max(300, window.innerWidth - e.clientX), window.innerWidth - 240);
    main.style.setProperty('--aside', width + 'px');
  });
})();

// A box named in the address gets its panel filled without a click.
function restore() {
  if (!state.selected) return;
  const here = childrenAt(state.path);
  const box = here.find(n => n.id === state.selected)
           || (nodeAt(state.path)?.id === state.selected ? nodeAt(state.path) : null);
  if (box) select(box);
}

if (MODEL) {
  document.getElementById('panel').innerHTML = '<p class="empty">Pick a box.</p>';
  readAddress();
  render();
  restore();
} else {
  document.body.innerHTML = '<p style="padding:24px">No model embedded in this page.</p>';
}
</script>
</body>
</html>
